# Example Nginx server block for JustX CMS.
# Copy to /etc/nginx/sites-available/justxsystems.com, adjust the domain and
# paths, symlink into sites-enabled, then run:
#   sudo certbot --nginx -d justxsystems.com -d www.justxsystems.com
# to provision the Let's Encrypt certificate (certbot will rewrite the
# server block to add the SSL directives automatically).

server {
    listen 80;
    server_name justxsystems.com www.justxsystems.com;

    # Let Next.js serve its own optimized static assets directly, bypassing
    # the Node process for anything under /_next/static (immutable, far-future
    # cache headers already set by Next).
    location /_next/static/ {
        alias /var/www/justx-cms/.next/standalone/.next/static/;
        expires 365d;
        access_log off;
    }

    location /uploads/ {
        alias /var/www/justx-cms/.next/standalone/public/uploads/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 12M; # matches the 10MB media upload limit + headroom
}
